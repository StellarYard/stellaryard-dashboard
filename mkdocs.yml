site_name: StellarYard Documentation
site_description: Local development environment for the Stellar network
site_url: https://stellaryard.github.io/stellaryard-docs/
repo_url: https://github.com/StellarYard/stellaryard-dashboard
repo_name: StellarYard/stellaryard-dashboard

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - Architecture:
    - Overview: architecture/overview.md
    - stellaryard-core: architecture/core.md
    - stellaryard-cli: architecture/cli.md
    - stellaryard-dashboard: architecture/dashboard.md
  - API Reference:
    - Overview: api/overview.md
    - Containers: api/containers.md
    - Accounts: api/accounts.md
    - Contracts: api/contracts.md
    - Ledger: api/ledger.md
    - WebSocket: api/websocket.md
  - Guides:
    - Local Development: guides/local-development.md
    - Contract Deployment: guides/contract-deployment.md
    - Troubleshooting: guides/troubleshooting.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StellarYard
    - icon: fontawesome/brands/telegram
      link: https://t.me/Adejumo-2
