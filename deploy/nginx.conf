# StellarYard Dashboard - Production Reverse Proxy Configuration (Nginx)
#
# ARCHITECTURE & SECURITY BOUNDARY:
# Browser-native WebSocket APIs cannot attach custom HTTP Authorization headers.
# Exposing API keys in client-side bundles, URLs, or query strings is insecure.
#
# This reverse proxy acts as the trusted same-origin boundary (Backend-for-Frontend):
# 1. Serves the pre-built React/TypeScript dashboard statically from the same origin.
# 2. Authenticates clients at the perimeter (e.g., HTTP Basic Auth, corporate SSO, or VPN).
# 3. Securely attaches the STELLARYARD_API_KEY Bearer token when forwarding API and WebSocket
#    upgrade requests to stellaryard-core.
# 4. Forwards WebSocket upgrades for container log streaming (/api/v1/containers/{name}/logs).

server {
    listen 80;
    server_name localhost;

    # Root directory for static production build (npm run build -> dist/)
    root /var/www/html;
    index index.html;

    # SPA routing: fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and WebSocket requests to stellaryard-core
    location /api/ {
        # Proxy target for stellaryard-core
        proxy_pass http://stellaryard-core:8080;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject server-side API Key for upstream Core authentication.
        # Set STELLARYARD_API_KEY in your environment or substitute via envsubst.
        # Browser clients never see or store this secret token.
        proxy_set_header Authorization "Bearer ${STELLARYARD_API_KEY}";

        # Timeouts for persistent WebSocket log streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Operational health check bypass (if liveness probe is used)
    location /health {
        proxy_pass http://stellaryard-core:8080/health;
        proxy_set_header Host $host;
    }
}
